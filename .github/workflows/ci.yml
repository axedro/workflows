name: CI/CD Pipeline

# Trigger workflow on push to main/develop and PR to main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowcraft_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    
    - uses: actions/cache@v3
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('flowcraft/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    
    - name: Install dependencies
      working-directory: ./flowcraft
      run: pnpm install --frozen-lockfile
    
    - name: Run linting
      working-directory: ./flowcraft
      run: pnpm lint
    
    - name: Run type checking
      working-directory: ./flowcraft
      run: pnpm type-check
    
    - name: Run database migrations
      working-directory: ./flowcraft
      run: |
        cd packages/database
        pnpm migrate
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowcraft_test
    
    - name: Run unit tests
      working-directory: ./flowcraft
      run: pnpm test:unit
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowcraft_test
        REDIS_URL: redis://localhost:6379
    
    - name: Build packages
      working-directory: ./flowcraft
      run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      working-directory: ./flowcraft
      run: pnpm install --frozen-lockfile
    
    - name: Run security audit
      working-directory: ./flowcraft
      run: pnpm audit --audit-level high

  build-and-deploy:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    
    - name: Install dependencies
      working-directory: ./flowcraft
      run: pnpm install --frozen-lockfile
    
    - name: Build all packages
      working-directory: ./flowcraft
      run: pnpm build
    
    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          Automated release for commit ${{ github.sha }}
          
          Changes:
          - Build successful
          - All tests passing
          - Security audit passed
        draft: false
        prerelease: false 