name: Test Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Test step
      run: |
        echo "Hello from GitHub Actions!"
        echo "Current directory: $(pwd)"
        echo "Files in .github/workflows:"
        ls -la .github/workflows/ 